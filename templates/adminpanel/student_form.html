{% extends "base.html" %}
{% block title %}新增學員{% endblock %}
{% block content %}
<div class="page-header">
  <h3>新增學員</h3>
</div>

<div class="card" style="max-width: 520px;">
  <div class="card-body p-4">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label class="form-label small fw-semibold">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors|join:"、" }}</div>{% endif %}
      </div>
      {% endfor %}
      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary">建立學員</button>
        <a href="{% url 'adminpanel:student_list' %}" class="btn btn-outline-secondary">取消</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
