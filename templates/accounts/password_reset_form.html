{% extends "base.html" %}
{% block title %}忘記密碼{% endblock %}
{% block guest_content %}
<div class="auth-wrap">
  <div class="auth-card">
    <span class="fw-bold fs-5">忘記密碼</span>
    <p class="text-muted-sm mt-2 mb-4">請輸入註冊時使用的 Email，我們會寄送重設密碼連結給你。</p>
    <form method="post">
      {% csrf_token %}
      <div class="mb-4">
        <label class="form-label small fw-semibold">Email</label>
        {{ form.email }}
        {% if form.email.errors %}<div class="text-danger small mt-1">{{ form.email.errors|join:"、" }}</div>{% endif %}
      </div>
      <button type="submit" class="btn btn-primary w-100">寄送重設連結</button>
    </form>
    <a href="{% url 'login' %}" class="d-block text-center small mt-3">返回登入</a>
  </div>
</div>
{% endblock %}
