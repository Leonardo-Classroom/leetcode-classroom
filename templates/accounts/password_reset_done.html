{% extends "base.html" %}
{% block title %}請check信箱{% endblock %}
{% block guest_content %}
<div class="auth-wrap">
  <div class="auth-card text-center">
    <span class="fw-bold fs-5">信件已寄出</span>
    <p class="text-muted-sm mt-3">
      如果該 Email 有對應的帳號，重設密碼連結已經寄過去了，請到信箱查收（記得看一下垃圾信件夾）。
    </p>
    <a href="{% url 'login' %}" class="btn btn-primary w-100 mt-3">返回登入</a>
  </div>
</div>
{% endblock %}
