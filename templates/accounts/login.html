{% extends "base.html" %}
{% block title %}登入{% endblock %}
{% block guest_content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="d-flex align-items-center gap-2 mb-3">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h2"/><path d="M16 3h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-2"/><path d="M9 8h6"/><path d="M9 12h6"/><path d="M9 16h4"/></svg>
      <span class="fw-bold fs-5">LeetCode 教學管理系統</span>
    </div>
    <p class="text-muted-sm mb-4">請登入你的帳號</p>

    {% if form.errors %}
      <div class="alert alert-danger py-2 small">帳號或密碼錯誤，請再試一次</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label small fw-semibold">帳號</label>
        {{ form.username }}
        <div class="text-muted-sm mt-1">學員請用 Email 登入</div>
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold">密碼</label>
        {{ form.password }}
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary w-100">登入</button>
    </form>
    <a href="{% url 'password_reset' %}" class="d-block text-center small mt-3">忘記密碼？</a>
  </div>
</div>
{% endblock %}
